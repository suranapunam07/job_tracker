services:
  db:
    image: postgres:16
    container_name: job_tracker_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: job_tracker_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d job_tracker_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: job_tracker_backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+psycopg2://postgres:postgres@db:5432/job_tracker_db"
      SECRET_KEY: "change-this-development-secret"

  frontend:
    image: nginx:alpine
    container_name: job_tracker_frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro

volumes:
  postgres_data:
