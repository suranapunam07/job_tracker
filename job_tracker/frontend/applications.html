<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobTrack - Applications</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <div class="sidebar-brand">

            <div class="brand-icon">
                J
            </div>

            <span>
                JobTrack
            </span>

        </div>


        <nav class="sidebar-nav">

            <a href="dashboard.html" class="nav-item">
                <span class="nav-icon">⌂</span>
                Dashboard
            </a>

            <a href="applications.html" class="nav-item active">
                <span class="nav-icon">▣</span>
                Applications
            </a>

            <a href="interviews.html" class="nav-item">
                <span class="nav-icon">◷</span>
                Interviews
            </a>

            <a href="notes.html" class="nav-item">
                <span class="nav-icon">✎</span>
                Notes
            </a>

        </nav>


        <div class="sidebar-bottom">

            <button id="logoutButton" class="logout-btn">
                <span>↪</span>
                Logout
            </button>

        </div>

    </aside>


    <main class="main-content">

        <header class="dashboard-header">

            <div>

                <p class="eyebrow">
                    JOB SEARCH
                </p>

                <h1>
                    Applications
                </h1>

                <p class="dashboard-subtitle">
                    Manage all your job applications.
                </p>

            </div>

        </header>


        <!-- ADD APPLICATION -->

        <section class="dashboard-card">

            <div class="card-header">

                <div>

                    <h2>
                        Add Application
                    </h2>

                    <p>
                        Add a new job application.
                    </p>

                </div>

            </div>


            <form id="applicationForm">

                <div class="form-grid">

                    <div class="form-group">

                        <label for="companyName">
                            Company Name
                        </label>

                        <input
                            type="text"
                            id="companyName"
                            placeholder="e.g. Google"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="jobTitle">
                            Job Title
                        </label>

                        <input
                            type="text"
                            id="jobTitle"
                            placeholder="e.g. Software Engineer"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="applicationStatus">
                            Status
                        </label>

                        <select id="applicationStatus" required>

                            <option value="applied">
                                Applied
                            </option>

                            <option value="interview">
                                Interview
                            </option>

                            <option value="rejected">
                                Rejected
                            </option>

                            <option value="offer">
                                Offer
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label for="appliedDate">
                            Applied Date
                        </label>

                        <input
                            type="date"
                            id="appliedDate"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label for="deadline">
                            Deadline
                        </label>

                        <input
                            type="date"
                            id="deadline"
                        >

                    </div>


                    <div class="form-group">

                        <label for="salary">
                            Salary
                        </label>

                        <input
                            type="number"
                            id="salary"
                            placeholder="e.g. 80000"
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Add Application
                </button>


                <p
                    id="applicationMessage"
                    class="form-message"
                ></p>

            </form>

        </section>


        <!-- APPLICATION LIST -->

        <section class="dashboard-card">

            <div class="card-header">

                <div>

                    <h2>
                        Your Applications
                    </h2>

                    <p id="applicationsMessage">
                        Loading applications...
                    </p>

                </div>

            </div>


            <div id="applicationsList"></div>

        </section>

    </main>

</div>


<script src="js/app-shell.js"></script>
<script src="js/applications.js"></script>

</body>

</html>
