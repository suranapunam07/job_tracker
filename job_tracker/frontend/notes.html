<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobTrack - Notes</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <div class="sidebar-brand">

            <div class="brand-icon">
                J
            </div>

            <span>
                JobTrack
            </span>

        </div>


        <nav class="sidebar-nav">

            <a href="dashboard.html" class="nav-item">
                <span class="nav-icon">⌂</span>
                Dashboard
            </a>

            <a href="applications.html" class="nav-item">
                <span class="nav-icon">▣</span>
                Applications
            </a>

            <a href="interviews.html" class="nav-item">
                <span class="nav-icon">◷</span>
                Interviews
            </a>

            <a href="notes.html" class="nav-item active">
                <span class="nav-icon">✎</span>
                Notes
            </a>

        </nav>


        <div class="sidebar-bottom">

            <button
                id="logoutButton"
                class="logout-btn"
            >
                <span>↪</span>
                Logout
            </button>

        </div>

    </aside>


    <main class="main-content">

        <header class="dashboard-header">

            <div>

                <p class="eyebrow">
                    JOB SEARCH
                </p>

                <h1>
                    Notes
                </h1>

                <p class="dashboard-subtitle">
                    Keep important notes for your applications.
                </p>

            </div>

        </header>


        <!-- ADD NOTE -->

        <section class="dashboard-card">

            <div class="card-header">

                <div>

                    <h2>
                        Add Note
                    </h2>

                    <p>
                        Save a note for one of your applications.
                    </p>

                </div>

            </div>


            <form id="noteForm">

                <div class="form-group">

                    <label for="noteApplication">
                        Application
                    </label>

                    <select
                        id="noteApplication"
                        required
                    >

                        <option value="">
                            Select application
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="noteContent">
                        Note
                    </label>

                    <textarea
                        id="noteContent"
                        rows="6"
                        placeholder="Write your note here..."
                        required
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="primary-btn"
                >
                    Add Note
                </button>


                <p
                    id="noteMessage"
                    class="form-message"
                ></p>

            </form>

        </section>


        <!-- NOTES LIST -->

        <section class="dashboard-card">

            <div class="card-header">

                <div>

                    <h2>
                        Your Notes
                    </h2>

                    <p id="notesMessage">
                        Loading notes...
                    </p>

                </div>

            </div>


            <div id="notesList"></div>

        </section>

    </main>

</div>


<script src="js/app-shell.js"></script>
<script src="js/notes.js"></script>

</body>

</html>
